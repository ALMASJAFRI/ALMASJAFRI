<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#12263a"/>
      <stop offset="100%" stop-color="#0f3a4a"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#38bdf8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1000" height="240" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="240" rx="18" fill="url(#grid)"/>

  <circle cx="170" cy="40" r="170" fill="url(#glow1)">
    <animate attributeName="cx" values="170;260;170" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="40;70;40" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="850" cy="210" r="190" fill="url(#glow2)">
    <animate attributeName="cx" values="850;760;850" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="210;170;210" dur="11s" repeatCount="indefinite"/>
  </circle>

  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="15" fill="#38bdf8" fill-opacity="0.55">
    <text x="48" y="48">&lt;/&gt;</text>
    <text x="930" y="48">{ }</text>
    <text x="48" y="206">$ dotnet run</text>
    <text x="850" y="206">py main.py</text>
  </g>

  <text x="500" y="118" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="68" font-weight="800" fill="url(#name)" letter-spacing="1">Almas Jafri
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
  </text>

  <rect x="400" y="136" width="200" height="3" rx="1.5" fill="#38bdf8">
    <animate attributeName="width" values="0;200" dur="1.4s" fill="freeze"/>
    <animate attributeName="x" values="500;400" dur="1.4s" fill="freeze"/>
  </rect>

  <text x="500" y="178" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="500" fill="#cbd5e1" letter-spacing="3">BACKEND &amp; AI SYSTEMS ENGINEER
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.4;1" dur="1.8s" fill="freeze"/>
  </text>
</svg>
